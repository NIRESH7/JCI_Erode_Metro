name: jci
description: Powered by nutz

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.1+31

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  url_launcher: ^6.2.5
  http: ^1.2.0
  photo_view: ^0.15.0
  syncfusion_flutter_calendar: ^29.1.33
  page_transition: ^2.1.0
  get: ^4.6.6
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.9
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  # firebase_dynamic_links: ^3.0.1
  lottie: ^3.0.0
  flutter_local_notifications: ^19.0.0
  open_file: ^3.3.2
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  # app_settings: ^4.1.1
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flowder_v2: ^1.0.1
  syncfusion_flutter_pdfviewer: ^29.1.33
  share_plus: ^10.1.4
  dropdown_search: ^6.0.2
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2
  flutter_contacts: ^1.1.9+2
  image_picker: ^1.1.2
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/jci_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/jci_icon.png
  web:
    generate: true
    image_path: assets/images/jci_icon.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - .env
    - .env.production

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: pop-reg
      fonts:
        - asset: fonts/Poppins-Regular.ttf
    - family: pop-med
      fonts:
        - asset: fonts/Poppins-Medium.ttf
    - family: pop-semibold
      fonts:
        - asset: fonts/Poppins-SemiBold.ttf
    - family: pop-bold
      fonts:
        - asset: fonts/Poppins-Bold.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
